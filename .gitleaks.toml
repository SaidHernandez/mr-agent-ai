title = "Gitleaks Config"

[extend]
useDefault = true

[[rules]]
description = "Generic API Key"
id = "generic-api-key"
regex = '''(?i)(api[_\-]?key|apikey)\s*[:=]\s*['"]?[a-zA-Z0-9]{16,}['"]?'''
tags = ["key", "api"]

[[rules]]
description = "Generic Secret"
id = "generic-secret"
regex = '''(?i)(secret|password|passwd|pwd)\s*[:=]\s*['"]?[^\s'"]{8,}['"]?'''
tags = ["secret", "password"]
