name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -v

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine bump type
        id: bump
        run: |
          COMMIT=$(git log -1 --format="%s")
          echo "commit: $COMMIT"
          if echo "$COMMIT" | grep -qE '^(feat|fix|refactor|perf)(\(.+\))?!:|BREAKING CHANGE'; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT" | grep -qE '^feat(\(.+\))?:'; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMIT" | grep -qE '^(fix|perf|refactor)(\(.+\))?:'; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "bump=none" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and push tag
        id: tag
        if: steps.bump.outputs.bump != 'none'
        uses: anothrNick/github-tag-action@1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: ${{ steps.bump.outputs.bump }}
          TAG_PREFIX: v
          DEFAULT_BRANCH: main

      - name: Fetch new tag
        if: steps.bump.outputs.bump != 'none' && steps.tag.outputs.new_tag != ''
        run: git fetch --tags origin

      - name: Run GoReleaser
        if: steps.bump.outputs.bump != 'none' && steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
