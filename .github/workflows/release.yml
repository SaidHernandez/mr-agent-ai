name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -v

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine bump type
        id: bump
        run: |
          COMMIT=$(git log -1 --format="%s")
          echo "commit: $COMMIT"
          if echo "$COMMIT" | grep -qE '^(feat|fix|refactor|perf)(\(.+\))?!:|BREAKING CHANGE'; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT" | grep -qE '^feat(\(.+\))?:'; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMIT" | grep -qE '^(fix|perf|refactor)(\(.+\))?:'; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "bump=none" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and push tag
        id: tag
        if: steps.bump.outputs.bump != 'none'
        uses: anothrNick/github-tag-action@1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: ${{ steps.bump.outputs.bump }}
          TAG_PREFIX: v
          DEFAULT_BRANCH: main

      - name: Fetch new tag
        if: steps.bump.outputs.bump != 'none' && steps.tag.outputs.new_tag != ''
        run: |
          sudo chown -R "$(id -u):$(id -g)" .git
          git fetch --tags origin

      - name: Run GoReleaser
        if: steps.bump.outputs.bump != 'none' && steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        if: steps.bump.outputs.bump != 'none' && steps.tag.outputs.new_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          VERSION=${NEW_TAG#v}

          CHECKSUMS=$(curl -sL "https://github.com/SaidHernandez/mr-agent-ai/releases/download/${NEW_TAG}/checksums.txt")
          SHA_ARM64=$(echo "$CHECKSUMS" | grep "darwin_arm64.tar.gz" | awk '{print $1}')
          SHA_AMD64=$(echo "$CHECKSUMS" | grep "darwin_amd64.tar.gz" | awk '{print $1}')

          cat > Formula/mr-agent-ai.rb <<EOF
          class MrAgentAi < Formula
            desc "Multi-Agent AI Skill Installer — installs agent skills into any project."
            homepage "https://github.com/SaidHernandez/mr-agent-ai"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/SaidHernandez/mr-agent-ai/releases/download/${NEW_TAG}/mr-agent-ai_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_ARM64}"
              else
                url "https://github.com/SaidHernandez/mr-agent-ai/releases/download/${NEW_TAG}/mr-agent-ai_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_AMD64}"
              end
            end

            def install
              bin.install "mr-agent-ai"
            end

            test do
              system "#{bin}/mr-agent-ai", "--help"
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="formula/${NEW_TAG}"
          git checkout -b "$BRANCH"
          git add Formula/mr-agent-ai.rb
          git commit -m "Brew formula update for mr-agent-ai version ${NEW_TAG} [skip ci]"
          git push origin "$BRANCH"

          gh pr create \
            --title "Brew formula update for mr-agent-ai version ${NEW_TAG}" \
            --body "Automated formula update after release ${NEW_TAG}." \
            --base main \
            --head "$BRANCH"
