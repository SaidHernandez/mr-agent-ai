version: 2

project_name: mr-agent-ai

before:
  hooks:
    - go mod tidy

builds:
  - id: mr-agent-ai
    main: .
    binary: mr-agent-ai
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: mr-agent-ai
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
  groups:
    - title: "Breaking Changes"
      regexp: "^feat!|BREAKING CHANGE"
      order: 0
    - title: "Features"
      regexp: "^feat"
      order: 1
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 2
    - title: "Performance"
      regexp: "^perf"
      order: 3
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^ci:"
      - "\\[skip ci\\]"

brews:
  - name: mr-agent-ai
    repository:
      owner: SaidHernandez
      name: mr-agent-ai
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/SaidHernandez/mr-agent-ai"
    description: "Multi-Agent AI Skill Installer — installs agent skills into any project."
    license: MIT
    install: |
      bin.install "mr-agent-ai"
    test: |
      system "#{bin}/mr-agent-ai", "--help"
