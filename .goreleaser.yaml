version: 2

project_name: mr-agent-ai

before:
  hooks:
    - go mod tidy

builds:
  - id: mr-agent-ai
    main: .
    binary: mr-agent-ai
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: mr-agent-ai
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
  groups:
    - title: "Breaking Changes"
      regexp: "^feat!|BREAKING CHANGE"
      order: 0
    - title: "Features"
      regexp: "^feat"
      order: 1
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 2
    - title: "Performance"
      regexp: "^perf"
      order: 3
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^ci:"
      - "\\[skip ci\\]"


